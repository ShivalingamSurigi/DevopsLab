<html>
<head>
<title>Registration Form</title>
<link type="stylesheet href="style.css">
<body style="background-color:pink;">
</style>
</head>
<center>
<h1>Registration Page</h1>
<form action="Registration" method="GET">
<label>First Name</label><input type="text" name="Fname"><br>
<label>Middle Name</label><input type="text" name="Mname"><br>
<label>Last Name</label><input type="text" name="Lname"><br>
<label>Date Of Birth</label><input type="date" name="dob"><br>
<label>Email</label><input type="email" name="email">
<br>
<label>Gender</label> 
<input type="radio" name="Gender">Male</input>
<input type="radio" name="Gender">Female</input>
<input type="radio" name="Gender">Others</input>
<br>
<label>Phone No</label>
<input type="number" name="phno">
<br>
<label>Address</label>
<input type="textarea" rows=5 cols=5 name="addr">
<br>
<input type="checkbox">Accept terms and conditions<br>
<label>Branch</label>
<select name="ops">
<option value=05>CSE</option>
<option value=02>CSM</option>
<option value=06>EEE</option>
<option value=04>ECE</option>
</select>
<br>
<button type="submit">Submit</button>
<button type="reset">Reset</button>
</from>
</center>
</body>
</html>
